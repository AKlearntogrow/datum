services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: datum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: datum
      POSTGRES_PASSWORD: datum_dev_password
      POSTGRES_DB: datum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/alembic/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datum -d datum"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
